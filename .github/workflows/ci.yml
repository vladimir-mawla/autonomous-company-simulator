# WHY THIS WORKFLOW EXISTS
# ─────────────────────────────────────────────────────────────────────────
# The brief requires that this project run from a clean clone with a
# README. Verified only locally, that claim rests on one developer's
# machine and whatever node_modules/cache state happened to already be
# sitting there. This workflow's value is NOT "the tests pass" (they pass
# locally already); it is proving the clean-clone claim on a machine nobody
# here controls: a fresh checkout, a fresh `npm ci`, no leftover state, no
# assumptions about what is already installed. If it is green, "clone and
# run it" is true for anyone, not just for the machine that built it.
#
# It also closes a second gap by construction rather than by discipline.
# From M1 onward some of this project's central guarantees are
# compile-time only: a `void` standing that carries a `warrant`, or an
# `inherited` standing without a heir, must not compile (.genesis/DONE.html,
# gate 5). Breaking such a guarantee fails no vitest test; only
# `npm run typecheck` sees it, and `npm run lint` cannot help because
# eslint ignores .ts/.tsx (typescript-eslint cannot load on TypeScript 7).
# Running typecheck on every push and pull request means a machine enforces
# those guarantees on every change, not whoever remembers to run it locally.
#
# At genesis (this commit) there is no engine code, so the workflow checks
# only the scaffold: install, typecheck, the one smoke test, and a build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, test, and build from a clean clone
    runs-on: ubuntu-latest
    # This job deliberately never references a repository secret. The engine
    # is designed to be deterministic and to read no external service (plan
    # D5 and D10: no cryptography, no LLM, no network, no key), and that
    # "needs no credentials" claim is asserted mechanically below, not just
    # left as this comment.
    permissions:
      contents: read
    steps:
      - name: Check out a fresh clone
        uses: actions/checkout@v4

      - name: Assert this workflow needs zero secrets
        # A mechanical check, not just a claim in a comment: scans this
        # workflow file's own non-comment lines for a reference to the
        # GitHub Actions secrets context, and fails the run if a future
        # edit adds one, so "this project needs no credentials" cannot
        # silently go stale. The search term is built by concatenation so
        # this very check does not trip over its own source line.
        run: |
          needle="secrets""."
          hits=$(grep -vE '^[[:space:]]*#' .github/workflows/ci.yml | grep -F "$needle" || true)
          if [ -n "$hits" ]; then
            echo "::error::This workflow is documented as needing zero secrets, but a step references the GitHub secrets context:"
            echo "$hits"
            exit 1
          fi
          echo "Confirmed: no step in this workflow reads a repository secret."

      - name: Set up Node (pinned to match engines.node in package.json)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies (npm ci only — never npm install)
        # npm ci, not npm install: an incoherent lockfile must fail the
        # build here, on a clean checkout, rather than being silently
        # rewritten. It is also the command that keeps npm 11.5.1 from
        # dropping a platform-specific optional dependency (see next step).
        run: npm ci

      - name: Verify vitest's platform native binding survived npm ci
        # vitest (via vite) resolves a platform-specific native binding from
        # the "rolldown" package's optional dependencies
        # (@rolldown/binding-<platform>). npm 11.5.1 has a known bug where
        # npm install can drop an optional dependency when it reconciles
        # against an existing lockfile (https://github.com/npm/cli/issues/4828);
        # when it does, `npm test` fails with a bare "Cannot find native
        # binding" that gives no hint that the *install*, not the code, is
        # at fault. Failing here instead, right after npm ci and before
        # typecheck or test even start, turns that confusing failure into an
        # immediate, clearly labelled one.
        run: |
          node -e "
            try {
              require('rolldown');
              console.log('rolldown native binding loaded OK for this platform.');
            } catch (e) {
              console.error('::error::vitest (via vite/rolldown) native binding did not survive npm ci -- ' + e.message);
              process.exit(1);
            }
          "

      - name: Typecheck (both tsconfigs — lib/ and app/)
        # npm run typecheck runs both configs in sequence (tsconfig.lib.json
        # then tsconfig.json). This is the step that catches compile-time-only
        # guarantees, which `npm test` alone cannot see.
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
